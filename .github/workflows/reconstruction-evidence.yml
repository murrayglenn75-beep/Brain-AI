name: Public evidence benchmark unit tests
on:
  pull_request:
  push:
    branches:
      - feature/inspection-assurance-20261013
permissions:
  contents: read
jobs:
  test-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s benchmarks/reconstruction_evidence -p 'test_*.py' -v

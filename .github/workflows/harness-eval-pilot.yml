name: Harness Eval Pilot
on:
  pull_request:
    paths:
      - 'scripts/promotion_gate.py'
      - 'scripts/test_promotion_gate.py'
      - '.github/workflows/harness-eval-pilot.yml'
  workflow_dispatch:
jobs:
  eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p 'test_promotion_gate.py' -v
